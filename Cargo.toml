[package]
name = "discord-rpc-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "discord-rpc-sidecar"
path = "src/main.rs"

[dependencies]
discord_social_rpc = "0.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
